<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>การบ้านครั้งที่ 3 · เว็บสั่งเครื่องดื่มหน้าร้าน</title>

    <style>
        :root {
            --bg: #f4f1ea;
            --card: #ffffff;
            --ink: #2b2b2b;
            --muted: #7a7a7a;
            --brand: #7b4b27;
            --brand-soft: #efe4d8;
            --accent: #2f7359;
            --danger: #c0392b;
            --line: #e6ded3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.7;
            transition: background .3s, color .3s;
        }

        body.dark {
            --bg: #1e1b18;
            --card: #2a2622;
            --ink: #efe9e2;
            --muted: #a99f92;
            --brand-soft: #3a332c;
            --line: #3d3730;
        }

        header {
            background: var(--brand);
            color: #fff;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 22px 16px 60px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media(max-width:720px) {
            .wrap {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 18px;
            color: var(--brand);
            border-bottom: 2px solid var(--brand-soft);
            padding-bottom: 6px;
        }

        body.dark .card h2 {
            color: #e0b088;
        }

        #menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--brand-soft);
            border: 1px solid var(--line);
            color: var(--ink);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
            font-family: inherit;
            transition: transform .1s, background .15s;
            text-align: left;
        }

        .menu-item:hover {
            transform: translateY(-2px);
        }

        .menu-item .price {
            font-weight: 700;
            color: var(--accent);
        }

        #order-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #order-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px dashed var(--line);
        }

        #order-list li .del {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }

        .empty {
            color: var(--muted);
            font-style: italic;
        }

        .summary {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px solid var(--brand-soft);
            display: flex;
            justify-content: space-between;
            font-size: 17px;
            font-weight: 700;
        }

        .summary .total {
            color: var(--accent);
        }

        form {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 140px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            background: var(--card);
            color: var(--ink);
        }

        button.action {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 15px;
            font-family: inherit;
            cursor: pointer;
        }

        #message {
            margin-top: 12px;
            min-height: 24px;
            font-weight: 600;
        }

        .ok {
            color: var(--accent);
        }

        .err {
            color: var(--danger);
        }

        .ghost {
            background: rgba(255, 255, 255, .18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 999px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>

<body>

    <header>
        <h1>☕ ร้านเครื่องดื่ม (สั่งออนไลน์)</h1>

        <!-- B2 ปุ่มโหมดมืด -->
        <button id="dark-toggle" class="ghost">🌙 โหมดมืด</button>
    </header>

    <div class="wrap">

        <!-- ฝั่งซ้าย -->
        <section class="card">
            <h2>เมนูเครื่องดื่ม</h2>

            <!-- B1 ช่องค้นหา -->
            <input
                type="text"
                id="search"
                placeholder="🔍 ค้นหาเมนู..."
                style="width:100%;margin-bottom:12px"
            >

            <div id="menu"></div>
        </section>

        <!-- ฝั่งขวา -->
        <section class="card">
            <h2>รายการที่สั่ง</h2>

            <ul id="order-list">
                <li class="empty" id="empty-hint">
                    ยังไม่ได้สั่งเครื่องดื่ม
                </li>
            </ul>

            <div class="summary">
                <span>
                    จำนวน:
                    <span id="count">0</span>
                    แก้ว
                </span>

                <span class="total">
                    รวม
                    <span id="total">0</span>
                    บาท
                </span>
            </div>

            <!-- B3 ปุ่มล้างออเดอร์ -->
            <button
                id="clear"
                class="ghost"
                style="margin-top:12px;color:var(--danger);border-color:var(--danger)"
            >
                🗑 ล้างออเดอร์
            </button>

            <form id="order-form">
                <input
                    type="text"
                    id="customer"
                    placeholder="ชื่อลูกค้า"
                >

                <button type="submit" class="action">
                    ยืนยันออเดอร์
                </button>
            </form>

            <div id="message"></div>
        </section>

    </div>

    <script>
        /* ============================================================
           ข้อมูลตั้งต้น
        ============================================================ */

        const drinks = [
            { name: "อเมริกาโน่เย็น", price: 45 },
            { name: "ลาเต้ร้อน", price: 50 },
            { name: "ชาไทย", price: 40 },
            { name: "โกโก้ปั่น", price: 55 },
            { name: "น้ำผึ้งมะนาว", price: 35 }
        ];

        let order = [];


        /* ============================================================
           STEP 0 : อ้างอิง Element
        ============================================================ */

        const menu = document.getElementById("menu");
        const orderList = document.getElementById("order-list");
        const countEl = document.getElementById("count");
        const totalEl = document.getElementById("total");
        const form = document.getElementById("order-form");
        const customer = document.getElementById("customer");
        const message = document.getElementById("message");


        /* ============================================================
           STEP 1 : สร้างเมนูจาก drinks
        ============================================================ */

        drinks.forEach((d) => {
            const button = document.createElement("button");

            button.classList.add("menu-item");

            const name = document.createElement("span");
            name.textContent = d.name;

            const price = document.createElement("span");
            price.classList.add("price");
            price.textContent = `${d.price} ฿`;

            button.appendChild(name);
            button.appendChild(price);

            button.dataset.name = d.name;
            button.dataset.price = d.price;

            menu.appendChild(button);
        });


        /* ============================================================
           STEP 2 : render()
        ============================================================ */

        function render() {
            orderList.innerHTML = "";

            if (order.length === 0) {
                const emptyItem = document.createElement("li");

                emptyItem.classList.add("empty");
                emptyItem.textContent = "ยังไม่ได้สั่งเครื่องดื่ม";

                orderList.appendChild(emptyItem);
            } else {
                order.forEach((item, i) => {
                    const li = document.createElement("li");

                    const text = document.createElement("span");
                    text.textContent =
                        `${item.name} ${item.price} บาท`;

                    const delButton = document.createElement("button");

                    delButton.classList.add("del");
                    delButton.textContent = "✕";
                    delButton.dataset.index = i;

                    li.appendChild(text);
                    li.appendChild(delButton);

                    orderList.appendChild(li);
                });
            }

            countEl.textContent = order.length;

            const total = order.reduce((sum, item) => {
                return sum + item.price;
            }, 0);

            totalEl.textContent = total;
        }


        /* ============================================================
           STEP 3 : คลิกเมนูเพื่อสั่ง
        ============================================================ */

        menu.addEventListener("click", (event) => {
            const button = event.target.closest(".menu-item");

            if (!button) {
                return;
            }

            const name = button.dataset.name;
            const price = Number(button.dataset.price);

            order.push({
                name: name,
                price: price
            });

            render();
        });


        /* ============================================================
           STEP 4 : ลบออเดอร์ทีละรายการ
        ============================================================ */

        orderList.addEventListener("click", (event) => {
            const deleteButton = event.target.closest(".del");

            if (!deleteButton) {
                return;
            }

            const index = Number(deleteButton.dataset.index);

            order.splice(index, 1);

            render();
        });


        /* ============================================================
           STEP 5 : ยืนยันออเดอร์
           B4 : Enter แล้วหน้าไม่รีเฟรช
        ============================================================ */

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const customerName = customer.value.trim();

            if (customerName === "" || order.length === 0) {
                message.textContent =
                    "กรุณากรอกชื่อลูกค้าและเลือกเครื่องดื่มอย่างน้อย 1 แก้ว";

                message.classList.remove("ok");
                message.classList.add("err");

                return;
            }

            const total = order.reduce((sum, item) => {
                return sum + item.price;
            }, 0);

            message.textContent =
                `ออเดอร์ของคุณ ${customerName} ทั้งหมด ${order.length} แก้ว รวม ${total} บาท`;

            message.classList.remove("err");
            message.classList.add("ok");
        });


        /* เรียก render ครั้งแรก */

        render();


        /* ============================================================
           B1 : ค้นหาเมนูแบบพิมพ์สด
        ============================================================ */

        const search = document.getElementById("search");

        search.addEventListener("input", (event) => {
            const keyword =
                event.target.value.trim().toLowerCase();

            const menuItems =
                menu.querySelectorAll(".menu-item");

            menuItems.forEach((item) => {
                const name =
                    item.dataset.name.toLowerCase();

                if (name.includes(keyword)) {
                    item.style.display = "flex";
                } else {
                    item.style.display = "none";
                }
            });
        });


        /* ============================================================
           B2 : โหมดมืด
        ============================================================ */

        const darkToggle =
            document.getElementById("dark-toggle");

        darkToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
        });


        /* ============================================================
           B3 : ล้างออเดอร์
        ============================================================ */

        const clearButton =
            document.getElementById("clear");

        clearButton.addEventListener("click", () => {
            order = [];
            render();

            message.textContent = "";
            message.classList.remove("ok", "err");
        });


        /* ============================================================
           B5 : Hover เมนูเปลี่ยนสี
        ============================================================ */

        menu.addEventListener("mouseover", (event) => {
            const button =
                event.target.closest(".menu-item");

            if (!button) {
                return;
            }

            button.style.background = "#d9c5b2";
        });

        menu.addEventListener("mouseout", (event) => {
            const button =
                event.target.closest(".menu-item");

            if (!button) {
                return;
            }

            button.style.background = "";
        });

    </script>

</body>

</html>
